name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (iPhone Simulator)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint & XcodeGen
        run: brew install swiftlint xcodegen

      - name: Lint (SwiftLint)
        run: swiftlint lint --strict

      # The real config is gitignored; placeholder values compile fine
      # and unit tests never hit the network.
      - name: Create Supabase config stub
        run: cp Sources/App/SupabaseConfig.swift.example Sources/App/SupabaseConfig.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ios/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Pick whatever iPhone simulator the runner image ships, so the job
      # survives Xcode image updates that rename device models.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          iphones = [d for runtime in devices.values() for d in runtime if d['name'].startswith('iPhone')]
          print(iphones[-1]['udid'])
          ")
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Pictalis.xcodeproj \
            -scheme Pictalis \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO
