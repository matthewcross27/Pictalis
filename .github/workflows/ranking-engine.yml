name: Ranking Engine

on:
  push:
    branches: [main]
    paths:
      - "ranking-engine/**"
      - ".github/workflows/ranking-engine.yml"
  pull_request:
    branches: [main]
    paths:
      - "ranking-engine/**"
      - ".github/workflows/ranking-engine.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ranking-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ranking-engine/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
