name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ranking-engine:
    name: Ranking Engine (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ranking-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ranking-engine/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  worker:
    name: Processing Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run pytest -v
      - run: uv run ruff check src tests
