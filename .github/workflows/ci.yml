name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ranking-engine:
    name: Ranking Engine (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ranking-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ranking-engine/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  worker:
    name: Processing Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run pytest -v
      - run: uv run ruff check src tests

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        run: |
          for f in backend/supabase/functions/*/index.ts; do
            echo "Checking $f"
            deno check "$f"
          done
