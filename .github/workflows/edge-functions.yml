name: Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "backend/supabase/functions/**"
      - ".github/workflows/edge-functions.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/supabase/functions/**"
      - ".github/workflows/edge-functions.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('backend/supabase/functions/deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: Format check
        run: deno fmt --check .
      - name: Lint
        run: deno lint .
      - name: Type-check function entry points
        run: deno check */index.ts
      - name: Test shared logic
        run: deno test --allow-env _shared/

  deploy:
    name: Deploy functions to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-${{ github.workflow }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Deploy functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
