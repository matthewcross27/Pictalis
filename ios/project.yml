name: Pictalis
options:
  bundleIdPrefix: com.matthewcross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.0.0

targets:
  Pictalis:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Pictalis/Info.plist
      properties:
        CFBundleDisplayName: Pictalis
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Pictalis needs access to your photos to help you curate your favorites."
        NSPhotoLibraryAddUsageDescription: "Pictalis saves your favorite photos back to your library."
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - Fraunces-Regular.ttf
          - Fraunces-Medium.ttf
          - Fraunces-SemiBold.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry

  PictalisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Pictalis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
