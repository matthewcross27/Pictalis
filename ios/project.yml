name: picHelper
options:
  bundleIdPrefix: com.matthewcross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  picHelper:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: picHelper/Info.plist
      properties:
        CFBundleDisplayName: picHelper
        UILaunchStoryboardName: ""
        NSPhotoLibraryUsageDescription: "picHelper needs access to your photos to help you curate your favorites."
        NSPhotoLibraryAddUsageDescription: "picHelper saves your favorite photos back to your library."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  picHelperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: picHelper
